name: ChordFlow Melody VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Get ChordFlow
        uses: actions/checkout@v4

      - name: Get JUCE
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure ChordFlow
        run: |
          cmake -S . \
            -B build \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build ChordFlow VST3
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Find plugin
        run: |
          echo "Looking for ChordFlow VST3..."
          find . -type d -name "*.vst3" -print

      - name: Package plugin
        run: |
          mkdir -p artifact

          PLUGIN=$(find . -type d -name "*.vst3" -print -quit)

          if [ -z "$PLUGIN" ]; then
            echo "ERROR: ChordFlow VST3 was not found."
            exit 1
          fi

          echo "Plugin found:"
          echo "$PLUGIN"

          cp -R "$PLUGIN" artifact/

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$PLUGIN" \
            "artifact/ChordFlow-Melody-VST3.zip"

      - name: Give me the VST3
        uses: actions/upload-artifact@v4
        with:
          name: ChordFlow-Melody-VST3
          path: artifact/ChordFlow-Melody-VST3.zip
