name: ChordFlow Melody - Final VST3 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:

      - name: Checkout ChordFlow
        uses: actions/checkout@v4

      - name: Install JUCE
        run: |
          git clone --depth 1 \
            https://github.com/juce-framework/JUCE.git \
            "$RUNNER_TEMP/JUCE"

      - name: Configure
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE" \
            -B "$RUNNER_TEMP/chordflow" \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: |
          cmake \
            --build "$RUNNER_TEMP/chordflow" \
            --config Release \
            --parallel

      - name: Show build result
        run: |
          echo "===================================="
          echo "CHORDFLOW BUILD OUTPUT"
          echo "===================================="

          find "$RUNNER_TEMP/chordflow" \
            -maxdepth 8 \
            -print | sort

      - name: Find VST3
        id: find-vst3
        run: |
          PLUGIN=$(find "$RUNNER_TEMP/chordflow" \
            -type d \
            -name "*.vst3" \
            -print -quit)

          if [ -z "$PLUGIN" ]; then
            echo "NO_VST3=true" >> "$GITHUB_OUTPUT"
            echo "No VST3 bundle was found."
          else
            echo "NO_VST3=false" >> "$GITHUB_OUTPUT"
            echo "PLUGIN=$PLUGIN" >> "$GITHUB_OUTPUT"
            echo "Found:"
            echo "$PLUGIN"
          fi

      - name: Package VST3
        if: steps.find-vst3.outputs.NO_VST3 == 'false'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          PLUGIN="${{ steps.find-vst3.outputs.PLUGIN }}"

          cp -R "$PLUGIN" "$GITHUB_WORKSPACE/output/"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$PLUGIN" \
            "$GITHUB_WORKSPACE/output/ChordFlow-Melody-VST3.zip"

      - name: Upload VST3
        if: steps.find-vst3.outputs.NO_VST3 == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ChordFlow-Melody-VST3
          path: output/ChordFlow-Melody-VST3.zip
